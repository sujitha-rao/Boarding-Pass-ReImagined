name: Send review feedback to factory

# Lives in each app repo. scripts/install-trigger.mjs fills in the placeholders
# and opens a pull request that adds this file.
#
# When a factory pull request gets the revise label, the factory reads the
# review comments on it and has an agent change the branch.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  notify:
    # Only a factory branch of this repo (never a fork), and only people on the
    # list, so a stranger cannot spend your agent subscription.
    if: >-
      github.event.label.name == 'revise' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'factory/issue-') &&
      contains(fromJSON('["sujitha-rao"]'), github.actor)
    runs-on: ubuntu-latest
    steps:
      - name: Start the factory
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          ISSUE_NUMBER="${HEAD_REF#factory/issue-}"
          case "$ISSUE_NUMBER" in
            ''|*[!0-9]*) echo "Branch $HEAD_REF does not end in an issue number."; exit 1 ;;
          esac
          gh api --method POST repos/sujitha-rao/software-factory/dispatches \
            -f event_type=pr-revise \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" \
            -F "client_payload[issue]=$ISSUE_NUMBER" \
            -F "client_payload[pr]=$PR_NUMBER"
